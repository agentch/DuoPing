name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本，例如 0.1.0（不要包含 v 前缀）"
        required: true
        type: string
      prerelease:
        description: "标记为预发布版本"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release source and version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if ($env:SOURCE_REF -ne 'refs/heads/main') {
            throw 'Releases must run from the main branch.'
          }

          $version = $env:RELEASE_VERSION
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid semantic version: $version"
          }

          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoManifest = Get-Content src-tauri/Cargo.toml -Raw
          $cargoVersion = [regex]::Match($cargoManifest, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $versions = @($packageVersion, $tauriVersion, $cargoVersion)
          if (($versions | Select-Object -Unique).Count -ne 1 -or $packageVersion -ne $version) {
            throw "Version mismatch: input=$version package.json=$packageVersion tauri.conf.json=$tauriVersion Cargo.toml=$cargoVersion"
          }

          $tag = "v$version"
          if (git tag --list $tag) {
            throw "Tag already exists: $tag"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build

      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoPing-Windows-NSIS-v${{ inputs.version }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create tag and GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'NSIS installer was not generated.'
          }

          $arguments = @(
            'release', 'create', $tag, $installer.FullName,
            '--target', $env:RELEASE_TARGET, '--title', "DuoPing $tag", '--generate-notes'
          )
          if ($env:RELEASE_PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }
          gh @arguments
